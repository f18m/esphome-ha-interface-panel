
- obj:
    x: 0
    y: 0
    scrollable: true
    # total height computed as: 
    #   70px [row] + 4px [padding] +
    #   70px [row] + 4px [padding] +
    #   70px [row] + 4px [padding] +
    #   220px [row]
    height: 450
    layout:
      type: GRID

      grid_rows: [ FR(10),FR(10),FR(10),FR(30) ]
      grid_columns: [ FR(1) ]
      pad_column: 0
      pad_row: 4
      # type: flex
      # flex_flow: column
      # #flex_align_main: space_evenly
      # flex_align_main: start
      # flex_align_track: start
      # flex_align_cross: start
    widgets:
      # this is 70px height
      - !include { 
          file: lvgl_row_set_temperature.yaml, 
          vars: { 
            id: "diurno_p1", 
            icon: "$mdi_sun_thermometer",
            time_schedule: "Giorno", 
            ha_temperature_sensor_id: "input_number.temperatura_riscaldamento_diurno_stanze_p1" 
          } 
        }
      # this is 70px height
      - !include { 
          file: lvgl_row_set_temperature.yaml, 
          vars: { 
            id: "notturno_p1", 
            icon: "$mdi_coolant_temperature",
            time_schedule: "Notte", 
            ha_temperature_sensor_id: "input_number.temperatura_riscaldamento_notturno_stanze_p1" 
          } 
        }
        # this is 70px height
      - !include { 
          file: lvgl_row_current_temperature.yaml, 
          vars: { 
            id: "p1", 
          } 
        }
        # this is 220px height
      - obj:
          scrollable: false
          layout: horizontal
          height: 220
          widgets:
            - !include { 
                file: lvgl_box_room_heating_status.yaml, 
                vars: { 
                  room_id: "bagno_p1", 
                  room_name: "Bagno", 
                } 
              }
            - !include { 
                file: lvgl_box_room_heating_status.yaml, 
                vars: { 
                  room_id: "cameretta_gialla", 
                  room_name: "Cam. Gialla", 
                } 
              }
            - !include { 
                file: lvgl_box_room_heating_status.yaml, 
                vars: { 
                  room_id: "cameretta_arancione", 
                  room_name: "Cam. Arancio", 
                } 
              }
            - !include { 
                file: lvgl_box_room_heating_status.yaml, 
                vars: { 
                  room_id: "cameretta_verde", 
                  room_name: "Cam. Verde", 
                } 
              }
