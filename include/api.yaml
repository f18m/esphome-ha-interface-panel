# File: api.yaml
# Purpose: Configures ESPHome API encryption and updates the UI Wi-Fi
# indicator on HA connect/disconnect events.
# List of subtitutions:
#   - encryption_key

# Enable Home Assistant API
api:
  encryption:
    key: ${encryption_key}

  # logic related to the API connection status icon 
  #  https://esphome.io/cookbook/lvgl/#api-connection-status-icon
  on_client_connected:
    - if:
        condition:
          lambda: 'return (0 == client_info.find("Home Assistant "));'
        then:
          - logger.log:
              level: INFO
              format: "Home Assistant connected, syncing window contact UI"
          - script.execute: sync_all_window_contact_ui
          - lvgl.widget.show: lbl_wifi
          - lvgl.label.update:
              id: lbl_wifi
              text_color: $icon_on_color
  on_client_disconnected:
    - if:
        condition:
          lambda: 'return (0 == client_info.find("Home Assistant "));'
        then:
          - lvgl.widget.show: lbl_wifi
          - lvgl.label.update:
              id: lbl_wifi
              text_color: $icon_off_color
