# File: api.yaml
# Purpose: Configures ESPHome API encryption and updates the UI Wi-Fi
# indicator on HA connect/disconnect events.
# List of subtitutions:
#   - none

# Enable Home Assistant API
api:
  encryption:
    key: !secret encryption_key

  # logic related to the API connection status icon 
  #  https://esphome.io/cookbook/lvgl/#api-connection-status-icon
  on_client_connected:
    - if:
        condition:
          lambda: 'return (0 == client_info.find("Home Assistant "));'
        then:
          - lvgl.widget.show: wifi_label
          - lvgl.label.update:
              id: wifi_label
              text_color: 0x22C55E
  on_client_disconnected:
    - if:
        condition:
          lambda: 'return (0 == client_info.find("Home Assistant "));'
        then:
          - lvgl.widget.show: wifi_label
          - lvgl.label.update:
              id: wifi_label
              text_color: 0xEF4444