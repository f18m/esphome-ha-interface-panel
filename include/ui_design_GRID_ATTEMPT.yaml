
# This is the main LVGL section.
# Manual Design attempt
lvgl:
  displays:
    - my_display
  pages:
    - id: main_page
      layout: 
        # see https://esphome.io/components/lvgl/layouts/#grid
        type: grid
        grid_rows: [ FR(1), FR(1), FR(1) ] 
        grid_columns: [ FR(1), FR(1), FR(1), FR(1) ]
      styles: page_style
      #<<: !include esphome-modular-lvgl-buttons/widgets/swipe_navigation.yaml
      on_swipe_right:
          - lambda: 'lv_indev_wait_release(lv_indev_get_act());'
          - logger.log: "Swipe right"
          - lvgl.page.next:
              animation: OUT_RIGHT
              time: 300ms
      on_swipe_left:
          - lambda: 'lv_indev_wait_release(lv_indev_get_act());'
          - logger.log: "Swipe left"
          - lvgl.page.previous:
              animation: OUT_LEFT
              time: 300ms
      widgets:
          # You can use the package section above to add prebuilt button types or build your own custom button from scratch here.
          # - container:
          #     id: main_page_title
          #     grid_cell_x_align: stretch
          #     grid_cell_y_align: stretch
          #     grid_cell_row_pos: 0
          #     grid_cell_column_pos: 0
          #     grid_cell_row_span: 3
          #     grid_cell_column_span: 3
          #     outline_width: 1   # debug code - This is for visualizing boundries remove for production
          #     outline_color: red # debug code - This is for visualizing boundries remove for production
          #     widgets:
        - label:
            grid_cell_row_pos: 0
            grid_cell_column_pos: 0
            outline_width: 1
            text_font: $text_font
            align: center
            text_color: white
            text: "MAIN PAGE"
            
        - button:
            grid_cell_row_pos: 0
            grid_cell_column_pos: 3
            #grid_cell_column_span: 1
            outline_width: 1
            id: button_time
            bg_opa: TRANSP
            widgets:
              - label:
                  id: time_label
                  styles: time_style
                  text: '12:00 pm'
            on_short_click:
                then:
                  lvgl.page.show: info_screen
        - buttonmatrix:
            grid_cell_row_pos: 2
            grid_cell_column_pos: 0
            grid_cell_column_span: 4
            outline_width: 1
            align: bottom #bottom_mid
            styles: header_footer
            pad_all: 0
            id: main_page_navbar
            items:
              styles: header_footer
            rows:
              - buttons:
                - id: main_page_prev
                  text: "\uF053 INFO"
                  on_press:
                    then:
                      lvgl.page.previous:
                - id: main_page_next
                  text: "\uF054 COVERS"
                  on_press:
                    then:
                      lvgl.page.next:

    - id: cover_page
      layout: 3x4
      styles: page_style
      #<<: !include esphome-modular-lvgl-buttons/widgets/swipe_navigation.yaml
      # Swipe navigation
      on_swipe_right:
          - lambda: 'lv_indev_wait_release(lv_indev_get_act());'
          - logger.log: "Swipe right -- denied"
          #- lvgl.page.next:
          #    animation: OUT_RIGHT
          #    time: 300ms
      on_swipe_left:
          - lambda: 'lv_indev_wait_release(lv_indev_get_act());'
          - logger.log: "Swipe left"
          - lvgl.page.previous:
              animation: OUT_LEFT
              time: 300ms
      widgets:
          # You can use the package section above to add prebuilt button types or build your own custom button from scratch here.
          - container:
              id: cover_page_title
              grid_cell_x_align: stretch
              grid_cell_y_align: stretch
              grid_cell_row_pos: 0
              grid_cell_column_pos: 1
              grid_cell_row_span: 1
              grid_cell_column_span: 2
              outline_width: 1   # debug code - This is for visualizing boundries remove for production
              outline_color: red # debug code - This is for visualizing boundries remove for production
              widgets:
                - label:
                    text_font: $text_font
                    align: center
                    text_color: white
                    text: "COVERS PAGE"
                - buttonmatrix:
                    align: bottom_mid
                    styles: header_footer
                    pad_all: 0
                    outline_width: 0
                    id: cover_page_navbar
                    items:
                      styles: header_footer
                    rows:
                      - buttons:
                        - id: cover_page_prev
                          text: "\uF053"
                          on_press:
                            then:
                              lvgl.page.previous:
                        - id: cover_page_home
                          text: "\uF015"
                          on_press:
                            then:
                              lvgl.page.show: main_page
                        - id: cover_page_next
                          text: ""
