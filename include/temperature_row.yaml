#
# A row of widgets to control the temperature of a single room, with a label and two buttons to increase/decrease the temperature.
#

- label:
    id: label_floor_${id}
    x: 0
    y: 0
    width: 170
    height: 30
    text: "Piano Terra"
    text_color: 0xFF6B6B
- button:
    id: btn_spin_down_daytime_${id}
    x: 175
    y: 0
    width: 40
    height: 30
    bg_color: 0x4F46E5
    on_click:
        - lvgl.spinbox.decrement: spinbox_temperature_${id}
    widgets:
      - label:
          text: "-"
          text_align: CENTER
          text_color: 0xFFFFFF
          align: CENTER
- spinbox:
    id: spinbox_temperature_${id}
    x: 220
    y: 0
    width: 70
    height: 30
    value: 15
    range_from: 15
    range_to: 25
    digits: 3
    decimal_places: 1
    text_color: 0x000000
    text_align: CENTER
    bg_color: 0xFFFFFF
    border_width: 1
    border_color: 0xCCCCCC
    on_value:
        then:
        - homeassistant.action:
            action: input_number.set_value
            data:
                entity_id: ${sensor_entity_id}
                value: !lambda return x;
- button:
    id: btn_spin_up_daytime_${id}
    x: 295
    y: 0
    width: 40
    height: 30
    bg_color: 0x4F46E5
    on_click:
        - lvgl.spinbox.increment: spinbox_temperature_${id}
    widgets:
      - label:
          text: "+"
          text_align: CENTER
          text_color: 0xFFFFFF
          align: CENTER