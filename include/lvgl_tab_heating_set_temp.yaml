# File: lvgl_tab_heating_set_temp.yaml
# Purpose: Defines a reusable tab for setting heating target temperature
#          with spinboxes and +/- buttons.
#
# List of substitutions:
#   - temp_setting_daytime_id, temp_setting_daytime_ha_sensor, temp_setting_daytime_label
#   - temp_setting_nighttime_id, temp_setting_nighttime_ha_sensor, temp_setting_nighttime_label
#
- obj:
    x: 0
    y: 0
    scrollable: false
    layout: vertical
    widgets:
      # this is 70px height
      - !include { 
          file: lvgl_row_set_temperature.yaml, 
          vars: { 
            id: "${temp_setting_daytime_id}", 
            icon: "$mdi_sun_thermometer",
            time_schedule: "${temp_setting_daytime_label}", 
            ha_temperature_sensor_id: "${temp_setting_daytime_ha_sensor}" 
          } 
        }
      # this is 70px height
      - !include { 
          file: lvgl_row_set_temperature.yaml, 
          vars: { 
            id: "${temp_setting_nighttime_id}", 
            icon: "$mdi_coolant_temperature",
            time_schedule: "${temp_setting_nighttime_label}", 
            ha_temperature_sensor_id: "${temp_setting_nighttime_ha_sensor}" 
          } 
        }
        # this is 70px height
      - !include { 
          file: lvgl_row_current_temperature.yaml, 
          vars: { 
            id: "p1", 
          } 
        }
