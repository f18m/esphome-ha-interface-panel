
- obj:
    x: 0
    y: 0
    scrollable: false
    layout: vertical
    widgets:
      # this is 70px height
      - !include { 
          file: lvgl_row_set_temperature.yaml, 
          vars: { 
            id: "${temp_setting1_id}", 
            icon: "${temp_setting1_icon}",
            time_schedule: "${temp_setting1_label}", 
            ha_temperature_sensor_id: "${temp_setting1_ha_sensor}" 
          } 
        }
      # this is 70px height
      - !include { 
          file: lvgl_row_set_temperature.yaml, 
          vars: { 
            id: "${temp_setting2_id}", 
            icon: "${temp_setting2_icon}",
            time_schedule: "${temp_setting2_label}", 
            ha_temperature_sensor_id: "${temp_setting2_ha_sensor}" 
          } 
        }
        # this is 70px height
      - !include { 
          file: lvgl_row_current_temperature.yaml, 
          vars: { 
            id: "p1", 
          } 
        }
