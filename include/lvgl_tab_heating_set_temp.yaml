
- obj:
    x: 0
    y: 0
    scrollable: false
    layout: vertical
    widgets:
      # this is 70px height
      - !include { 
          file: lvgl_row_set_temperature.yaml, 
          vars: { 
            id: "diurno_p1", 
            icon: "$mdi_sun_thermometer",
            time_schedule: "Giorno", 
            ha_temperature_sensor_id: "input_number.temperatura_riscaldamento_diurno_stanze_p1" 
          } 
        }
      # this is 70px height
      - !include { 
          file: lvgl_row_set_temperature.yaml, 
          vars: { 
            id: "notturno_p1", 
            icon: "$mdi_coolant_temperature",
            time_schedule: "Notte", 
            ha_temperature_sensor_id: "input_number.temperatura_riscaldamento_notturno_stanze_p1" 
          } 
        }
        # this is 70px height
      - !include { 
          file: lvgl_row_current_temperature.yaml, 
          vars: { 
            id: "p1", 
          } 
        }
