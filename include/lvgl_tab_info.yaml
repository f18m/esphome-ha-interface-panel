# File: lvgl_info_page.yaml
# Purpose: Defines widgets shown in the Info tab, including diagnostics
# labels and QR codes.
# List of subtitutions:
#   - none

#
# INFO TAB
#

- obj:
    width: 100%
    height: 100%
    bg_color: $bg_color
    layout:
      type: GRID
      grid_rows: [ content,content,content,content,content,content,content,content,content,content,content,content,content,content,content,content,content ]
      grid_columns: [ FR(45), FR(55) ]
      pad_column: 4
      pad_row: 5
    widgets:
      - label:
          grid_cell_column_pos: 0
          grid_cell_row_pos: 1
          grid_cell_x_align: STRETCH
          grid_cell_y_align: CENTER
          text: "Uptime:"
          text_color: $label_description_color
      - label:
          id: lbl_uptime
          grid_cell_column_pos: 1
          grid_cell_row_pos: 1
          grid_cell_x_align: STRETCH
          grid_cell_y_align: CENTER
          text: "N/A"
          text_color: $label_on_color
      - label:
          grid_cell_column_pos: 0
          grid_cell_row_pos: 2
          grid_cell_x_align: STRETCH
          grid_cell_y_align: CENTER
          text: "ESPHome Version:"
          text_color: $label_description_color
      - label:
          id: lbl_esphome_version
          grid_cell_column_pos: 1
          grid_cell_row_pos: 2
          grid_cell_x_align: STRETCH
          grid_cell_y_align: CENTER
          text: "Loading..."
          text_color: $label_on_color
      - label:
          grid_cell_column_pos: 0
          grid_cell_row_pos: 3
          grid_cell_x_align: STRETCH
          grid_cell_y_align: CENTER
          text: "Build Date:"
          text_color: $label_description_color
      - label:
          grid_cell_column_pos: 1
          grid_cell_row_pos: 3
          grid_cell_x_align: STRETCH
          grid_cell_y_align: CENTER
          text:
              format: "%s - %s"
              args: [__DATE__, __TIME__]
          text_color: $label_on_color
      - label:
          grid_cell_column_pos: 0
          grid_cell_row_pos: 4
          grid_cell_x_align: STRETCH
          grid_cell_y_align: CENTER
          text: "MAC Address:"
          text_color: $label_description_color
      - label:
          id: lbl_connected_mac
          grid_cell_column_pos: 1
          grid_cell_row_pos: 4
          grid_cell_x_align: STRETCH
          grid_cell_y_align: CENTER
          text: "00:00:00:00:00:00"
          text_color: $label_on_color
      - label:
          grid_cell_column_pos: 0
          grid_cell_row_pos: 5
          grid_cell_x_align: STRETCH
          grid_cell_y_align: CENTER
          text: "IP Address:"
          text_color: $label_description_color
      - label:
          id: lbl_ip_address
          grid_cell_column_pos: 1
          grid_cell_row_pos: 5
          grid_cell_x_align: STRETCH
          grid_cell_y_align: CENTER
          text: "0.0.0.0"
          text_color: $label_on_color
      - label:
          grid_cell_column_pos: 0
          grid_cell_row_pos: 6
          grid_cell_x_align: STRETCH
          grid_cell_y_align: CENTER
          text: "Connected SSID"
          text_color: $label_description_color
      - label:
          id: lbl_connected_ssid
          grid_cell_column_pos: 1
          grid_cell_row_pos: 6
          grid_cell_x_align: STRETCH
          grid_cell_y_align: CENTER
          text: "Updating..."
          text_color: $label_on_color
      - label:
          grid_cell_column_pos: 0
          grid_cell_row_pos: 7
          grid_cell_x_align: STRETCH
          grid_cell_y_align: CENTER
          text: "WiFi Strength"
          text_color: $label_description_color
      - label:
          id: lbl_wifi_signal_db_percent
          grid_cell_column_pos: 1
          grid_cell_row_pos: 7
          grid_cell_x_align: STRETCH
          grid_cell_y_align: CENTER
          text: "Updating..."
          text_color: $label_on_color
      - label:
          grid_cell_column_pos: 0
          grid_cell_row_pos: 8
          grid_cell_x_align: STRETCH
          grid_cell_y_align: CENTER
          text: "Device Name:"
          text_color: $label_description_color
      - label:
          id: lbl_device_name
          grid_cell_column_pos: 1
          grid_cell_row_pos: 8
          grid_cell_x_align: STRETCH
          grid_cell_y_align: CENTER
          text: "Updating..."
          text_color: $label_on_color

      # SPACER
      - obj:
          grid_cell_column_pos: 1
          grid_cell_row_pos: 9
          height: 20

      - label:
          grid_cell_column_pos: 0
          grid_cell_row_pos: 10
          grid_cell_x_align: STRETCH
          grid_cell_y_align: CENTER
          text: "Captive Portal Wi-Fi"
          text_color: $label_on_color
      - label:
          grid_cell_column_pos: 1
          grid_cell_row_pos: 10
          grid_cell_x_align: STRETCH
          grid_cell_y_align: CENTER
          text: "This device URL"
          text_color: $label_on_color
      - qrcode:
          id: qrcode_login
          grid_cell_column_pos: 0
          grid_cell_row_pos: 11
          grid_cell_x_align: START
          grid_cell_y_align: CENTER
          pad_left: 10
          pad_top: 10
          size: 150
          text: "WIFI:S:mynetwork;T:WPA;P:password;;"
      - qrcode:
          id: qrcode_ip_address
          grid_cell_column_pos: 1
          grid_cell_row_pos: 11
          grid_cell_x_align: START
          grid_cell_y_align: CENTER
          pad_left: 10
          pad_top: 10
          size: 150
          # this link is updated at runtime to point to the device IP address, so it can be used to quickly open the web interface on a phone
          text: "http://192.168.4.1"

      # SPACER
      - obj:
          grid_cell_column_pos: 1
          grid_cell_row_pos: 12
          height: 20

      - label:
          grid_cell_column_pos: 0
          grid_cell_row_pos: 13
          grid_cell_x_align: STRETCH
          grid_cell_y_align: CENTER
          text: "Project website"
          text_color: $label_on_color
      - qrcode:
          grid_cell_column_pos: 0
          grid_cell_row_pos: 14
          grid_cell_x_align: START
          grid_cell_y_align: CENTER
          pad_left: 10
          pad_top: 10
          size: 150
          text: "https://github.com/f18m/esphome-ha-interface-panel"

      # SPACER
      - obj:
          grid_cell_column_pos: 1
          grid_cell_row_pos: 15
          height: 20

      - image:
          grid_cell_column_pos: 0
          grid_cell_row_pos: 16
          grid_cell_column_span: 2
          grid_cell_x_align: CENTER
          grid_cell_y_align: CENTER
          align: bottom_mid
          src: esphome_img
