# File: lvgl_tab_heating_details_4.yaml
# Purpose: Defines a reusable tab for displaying heating details for 
#          4 rooms, including current target temperature and controls.
#
# List of substitutions:
#   - room1_id, room1_name, room1_ha_cover
#   - room2_id, room2_name, room2_ha_cover
#   - room3_id, room3_name, room3_ha_cover
#   - room4_id, room4_name, room4_ha_cover
#
- obj:
    x: 0
    y: 0
    scrollable: false
    # total height computed as: 
    #   220px [row]
    height: 240
    layout:
      type: GRID
      grid_rows: [ FR(11) ]
      grid_columns: [ FR(1) ]
      pad_column: 0
      pad_row: 4
      # type: flex
      # flex_flow: column
      # #flex_align_main: space_evenly
      # flex_align_main: start
      # flex_align_track: start
      # flex_align_cross: start
    widgets:
      - obj:
          scrollable: false
          layout: horizontal
          height: 220
          widgets:
            - !include { 
                file: lvgl_box_room_heating_status.yaml, 
                vars: { 
                  room_id: "${room1_id}", 
                  room_name: "${room1_name}", 
                } 
              }
            - !include { 
                file: lvgl_box_room_heating_status.yaml, 
                vars: { 
                  room_id: "${room2_id}", 
                  room_name: "${room2_name}", 
                } 
              }
            - !include { 
                file: lvgl_box_room_heating_status.yaml, 
                vars: { 
                  room_id: "${room3_id}", 
                  room_name: "${room3_name}", 
                } 
              }
            - !include { 
                file: lvgl_box_room_heating_status.yaml, 
                vars: { 
                  room_id: "${room4_id}", 
                  room_name: "${room4_name}", 
                } 
              }
