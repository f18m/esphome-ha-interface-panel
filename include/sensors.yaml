# File: sensors.yaml
# Purpose: Defines Home Assistant sensor integrations that update LVGL room
# temperature and heating controls.
# List of subtitutions:
#   - room1_id, room1_ha_temperature_sensor, room1_ha_humidity_sensor,
#     room1_ha_window_contact_sensor, room1_ha_floor_heating_switch, room1_ha_cover
#   - room2_id, room2_ha_temperature_sensor, room2_ha_humidity_sensor,
#     room2_ha_window_contact_sensor, room2_ha_floor_heating_switch, room2_ha_cover
#   - room3_id, room3_ha_temperature_sensor, room3_ha_humidity_sensor,
#     room3_ha_window_contact_sensor, room3_ha_floor_heating_switch, room3_ha_cover
#   - room4_id, room4_ha_temperature_sensor, room4_ha_humidity_sensor,
#     room4_ha_window_contact_sensor, room4_ha_floor_heating_switch, room4_ha_cover
#   - temp_setting_daytime_id, temp_setting_daytime_ha_sensor
#   - temp_setting_nighttime_id, temp_setting_nighttime_ha_sensor
#   - ha_temperature_target_sensor

#
# SENSORS
#
substitutions:
  sensors_rooms_4: !include { 
      file: sensors_room_status.yaml, 
      vars: { 
        room_id: "${room4_id}",
        ha_temperature_sensor_id: "${room4_ha_temperature_sensor}",
        ha_humidity_sensor_id: "${room4_ha_humidity_sensor}",
        ha_window_contact_sensor_id: "${room4_ha_window_contact_sensor}",
        ha_floor_heating_switch_id: "${room4_ha_floor_heating_switch}",
        ha_cover_id: "${room4_ha_cover}"
      }
    }

packages:

  # Import from HA the room sensors

  room1: !include { 
      file: sensors_room_status.yaml, 
      vars: { 
        room_id: "${room1_id}", 
        ha_temperature_sensor_id: "${room1_ha_temperature_sensor}", 
        ha_humidity_sensor_id: "${room1_ha_humidity_sensor}",
        ha_window_contact_sensor_id: "${room1_ha_window_contact_sensor}",
        ha_floor_heating_switch_id: "${room1_ha_floor_heating_switch}",
        ha_cover_id: "${room1_ha_cover}"
      } 
    }
  room2: !include { 
      file: sensors_room_status.yaml, 
      vars: { 
        room_id: "${room2_id}",
        ha_temperature_sensor_id: "${room2_ha_temperature_sensor}",
        ha_humidity_sensor_id: "${room2_ha_humidity_sensor}",
        ha_window_contact_sensor_id: "${room2_ha_window_contact_sensor}",
        ha_floor_heating_switch_id: "${room2_ha_floor_heating_switch}",
        ha_cover_id: "${room2_ha_cover}"
      }
    }
  room3: !include { 
      file: sensors_room_status.yaml, 
      vars: { 
        room_id: "${room3_id}",
        ha_temperature_sensor_id: "${room3_ha_temperature_sensor}",
        ha_humidity_sensor_id: "${room3_ha_humidity_sensor}",
        ha_window_contact_sensor_id: "${room3_ha_window_contact_sensor}",
        ha_floor_heating_switch_id: "${room3_ha_floor_heating_switch}",
        ha_cover_id: "${room3_ha_cover}"
      }
    }
  #room4: ${sensors_rooms_4 if num_rooms == '4' else {} }
  room4: !include { 
      file: sensors_room_status.yaml, 
      vars: { 
        room_id: "${room4_id}",
        ha_temperature_sensor_id: "${room4_ha_temperature_sensor}",
        ha_humidity_sensor_id: "${room4_ha_humidity_sensor}",
        ha_window_contact_sensor_id: "${room4_ha_window_contact_sensor}",
        ha_floor_heating_switch_id: "${room4_ha_floor_heating_switch}",
        ha_cover_id: "${room4_ha_cover}"
      }
    }



  # Import from HA the helpers that drive heating automations

  temp_setting_daytime: !include { 
      file: sensors_temperature_settings.yaml, 
      vars: { 
        id: "${temp_setting_daytime_id}",
        ha_temperature_sensor_id: "${temp_setting_daytime_ha_sensor}",
      }
    }
  temp_setting_nighttime: !include { 
      file: sensors_temperature_settings.yaml, 
      vars: { 
        id: "${temp_setting_nighttime_id}",
        ha_temperature_sensor_id: "${temp_setting_nighttime_ha_sensor}",
      }
    }
  temp_target: !include { 
      file: sensors_temperature_target.yaml, 
      vars: { 
        ha_temperature_sensor_id: "${ha_temperature_target_sensor}",
      }
    }

  import_health: !include sensors_import_health.yaml
