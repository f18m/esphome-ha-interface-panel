# File: lvgl_box_cover_control.yaml
# Purpose: Defines a reusable box that allows to control COVERS/SHUTTERS of a room.
# This looks like a ROUNDED VERTICAL BOX.
#
# List of subtitutions:
#   - room_id
#   - room_name
#   - ha_cover_id

obj:
  id: cover_box_container_${room_id}
  bg_color: $bg_color
  border_width: 2
  border_color: $border_color
  radius: 10
  scrollable: false

  width: 110
  height: 100%
  layout: vertical
  pad_all: 5

  widgets:
    - label:
        width: 100%

        # IMPORTANT: make the height of this label identical
        # across all instances of lvgl_box_cover_control.yaml,
        # since they will appear one next to each other in the UI, 
        # and if one of them has a different height, the buttons
        # will not be aligned across the different boxes.
        height: 35

        text: "${room_name}"
        text_font: visuelt_16
        text_align: CENTER
        text_color: $label_title_color
        long_mode: WRAP
        flex_grow: 0

    # UP BUTTON
    - button:
        width: 100
        height: 60
        flex_grow: 1 # can grow in this column (vertically)
        bg_color: $icon_temp_color
        pressed:
          bg_color: darkorange
        widgets:
          - label:
              id: cover_up_${room_id}
              align: CENTER
              text: "$mdi_chevron_up"
              text_font: $icon_font
              text_color: $label_on_color
        on_press:
          then:
            - homeassistant.action:
                action: cover.open_cover
                data:
                  entity_id: ${ha_cover_id}
            - logger.log:
                format: "Sending HA request to open cover ${ha_cover_id}"


    # STOP BUTTON
    - button:
        width: 100%
        height: 50
        flex_grow: 1 # can grow in this column (vertically)
        bg_color: $icon_temp_color
        pressed:
          bg_color: darkorange
        widgets:
          - label:
              id: cover_stop_${room_id}
              align: CENTER
              text: "STOP"
              #text_font: $icon_font
              text_color: $label_on_color
        on_press:
          then:
            - homeassistant.action:
                action: cover.stop_cover
                data:
                  entity_id: ${ha_cover_id}
            - logger.log:
                format: "Sending HA request to stop cover ${ha_cover_id}"

    # DOWN BUTTON
    - button:
        width: 100%
        height: 60
        flex_grow: 1 # can grow in this column (vertically)
        bg_color: $icon_temp_color
        pressed:
          bg_color: darkorange
        widgets:
          - label:
              id: cover_down_${room_id}
              align: CENTER
              text: "$mdi_chevron_down"
              text_font: $icon_font
              text_color: $label_on_color
        on_press:
          then:
            - homeassistant.action:
                action: cover.close_cover
                data:
                  entity_id: ${ha_cover_id}
            - logger.log:
                format: "Sending HA request to close cover ${ha_cover_id}"
