# File: lvgl_tab_ac_floor.yaml
# Purpose: Controls whole-floor AC power and fan speed presets.
# List of substitutions:
#   - ac_speed_text
#   - ac_climate_entity_id
#   - ac_turn_off_action_type
#   - ac_script_entity_id
#   - ac_fan_mode_low
#   - ac_fan_mode_medium
#   - ac_fan_mode_high
#   - ac_floor_initial_status    # text shown on boot, before the user presses any button

- obj:
    width: 100%
    height: 240
    scrollable: false
    layout:
      type: flex
      flex_flow: column
      flex_align_main: center
      flex_align_cross: center
      flex_align_track: center
      pad_row: 5
    widgets:
      - label:
          text: "Air Conditioning Control"
          text_color: $label_title_color
          text_font: visuelt_20

      # SPACER
      - obj:
          height: 20
          
      # Row showing the currently selected state: a static "Current speed:"
      # label followed by a dynamic label that gets updated at runtime.
      # The dynamic label's initial text is set via substitution; it is then
      # updated at runtime (lvgl.label.update) from each button's on_click,
      # since ESPHome substitutions are only resolved at compile time.
      - obj:
          width: 100%
          height: SIZE_CONTENT
          scrollable: false
          bg_opa: TRANSP
          layout:
            type: flex
            flex_flow: row
            flex_align_main: center
            flex_align_cross: center
            flex_align_track: center
            pad_column: 6
          widgets:
            - label:
                text: "${ac_speed_text}"
                text_color: $label_description_color
                text_font: visuelt_20

            - label:
                id: ac_floor_status_label_id
                text: ${ac_floor_initial_status}
                text_color: $label_description_color
                text_font: visuelt_20

      - obj:
          width: 100%
          height: 120
          scrollable: false
          bg_opa: TRANSP
          layout:
            type: flex
            flex_flow: row
            flex_align_main: space_evenly
            flex_align_cross: center
            flex_align_track: center
            pad_column: 8
          widgets:
            - button:
                id: btn_ac_floor_off
                width: 110
                height: 80
                bg_color: $icon_off_color
                pressed:
                  bg_color: darkred
                on_click:
                  - logger.log:
                      format: "AC selector: OFF (${ac_climate_entity_id})"
                  - homeassistant.action:
                      action: ${ac_turn_off_action_type}
                      data:
                        entity_id: ${ac_climate_entity_id}
                  - lvgl.label.update:
                      id: ac_floor_status_label_id
                      text: "OFF"
                widgets:
                  - label:
                      text: "OFF"
                      text_color: $label_on_color
                      align: CENTER

            - button:
                id: btn_ac_floor_low
                width: 110
                height: 80
                bg_color: $icon_temp_color
                pressed:
                  bg_color: darkorange
                on_click:
                  - logger.log:
                      format: "AC selector: LOW (${ac_script_entity_id} with speed=${ac_fan_mode_low})"

                  # execute a script defined on HomeAssistant to turn on the AC and set the fan to LOW
                  # the script must take a parameter named "speed"
                  - homeassistant.action:
                      action: ${ac_script_entity_id}
                      data:
                        speed: ${ac_fan_mode_low}
                  - lvgl.label.update:
                      id: ac_floor_status_label_id
                      text: "LOW"

                widgets:
                  - label:
                      text: "LOW"
                      text_color: $label_spinbtn_color
                      align: CENTER

            - button:
                id: btn_ac_floor_medium
                width: 110
                height: 80
                bg_color: $icon_temp_color
                pressed:
                  bg_color: darkorange
                on_click:
                  - logger.log:
                      format: "AC selector: MEDIUM (${ac_script_entity_id} with speed=${ac_fan_mode_medium})"

                  # execute a script defined on HomeAssistant to turn on the AC and set the fan to MEDIUM
                  # the script must take a parameter named "speed"
                  - homeassistant.action:
                      action: ${ac_script_entity_id}
                      data:
                        speed: ${ac_fan_mode_medium}
                  - lvgl.label.update:
                      id: ac_floor_status_label_id
                      text: "MEDIUM"
                widgets:
                  - label:
                      text: "MEDIUM"
                      text_color: $label_spinbtn_color
                      align: CENTER

            - button:
                id: btn_ac_floor_high
                width: 110
                height: 80
                bg_color: $icon_temp_color
                pressed:
                  bg_color: darkorange
                on_click:
                  - logger.log:
                      format: "AC selector: HIGH (${ac_script_entity_id} with speed=${ac_fan_mode_high})"

                  # execute a script defined on HomeAssistant to turn on the AC and set the fan to HIGH
                  # the script must take a parameter named "speed"
                  - homeassistant.action:
                      action: ${ac_script_entity_id}
                      data:
                        speed: ${ac_fan_mode_high}
                  - lvgl.label.update:
                      id: ac_floor_status_label_id
                      text: "HIGH"
                widgets:
                  - label:
                      text: "HIGH"
                      text_color: $label_spinbtn_color
                      align: CENTER