# File: lvgl_tab_rooms_3.yaml
# Purpose: creates 3 columns of room status displaying room status
#          labels and controls.
# List of subtitutions:
#   - none

#
# ROOMS TAB
#
- obj:
    x: 0
    y: 0
    scrollable: false
    layout: horizontal
    widgets:
      - !include { 
          file: lvgl_box_room_status.yaml, 
          vars: { 
            room_id: "${room1_id}", 
            room_name: "${room1_name}", 
          } 
        }
      - !include { 
          file: lvgl_box_room_status.yaml, 
          vars: { 
            room_id: "${room2_id}", 
            room_name: "${room2_name}", 
          } 
        }
      - !include { 
          file: lvgl_box_room_status.yaml, 
          vars: { 
            room_id: "${room3_id}", 
            room_name: "${room3_name}", 
          } 
        }