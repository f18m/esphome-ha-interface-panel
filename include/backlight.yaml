# File: backlight.yaml
# Purpose: Manages display backlight and LVGL pause/resume behavior based
# on idle timeout and touch activity.
# List of subtitutions:
#   - touchscreen_idle_timeout

lvgl:

  on_idle:
    timeout: ${touchscreen_idle_timeout}
    then:
      - logger.log: "LVGL is idle"
      - light.turn_off: display_backlight
      - lvgl.pause:

# Wake on screen touch - extends the touchscreen defined in hardware file
touchscreen:
  - id: !extend my_touchscreen
    on_touch:
      then:
        - logger.log:
            level: INFO
            format: "LVGL resuming"
        - lvgl.resume
        - lvgl.widget.redraw
        - light.turn_on: display_backlight
