# File: backlight.yaml
# Purpose: Manages display backlight and LVGL pause/resume behavior based
# on idle timeout and touch activity.
# List of subtitutions:
#   - touchscreen_idle_timeout

lvgl:

  on_idle:
    timeout: ${touchscreen_idle_timeout}
    then:
      - logger.log: "LVGL is idle"
      - light.turn_off: display_backlight
      - lvgl.pause:

# Wake on screen touch - extends the touchscreen defined in hardware file
touchscreen:
  - id: !extend my_touchscreen
    on_touch:
      then:
        - logger.log:
            level: INFO
            format: "LVGL resuming"
        - lvgl.resume
        - lvgl.widget.redraw
        - light.turn_on: display_backlight

time:
  - platform: homeassistant
    id: system_time
    on_time_sync:
      - script.execute: time_update
      
      # Update last restart time (only once)
      - if:
          condition:
            lambda: 'return id(device_last_restart).state == "";'
          then:
            - text_sensor.template.publish:
                id: device_last_restart
                state: !lambda 'return id(system_time).now().strftime("%a %d %b %Y - %I:%M:%S %p");'

    on_time:
      # Update time display every minute
      - seconds: 0
        minutes: '*'
        then:
          - script.execute: time_update
