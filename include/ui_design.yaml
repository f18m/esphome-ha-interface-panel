lvgl:
  pages:
    - id: main_page
      bg_color: 0x0D1117
      widgets:
        - label:
            id: time_label
            x: 5
            y: 5
            width: 200
            height: 30
            text: "10/03/2026 12:00"
            text_color: 0xFF6B6B

        - label:
            id: wifi_label
            x: 415 # screen width is 480
            y: 0
            width: 50
            height: 20
            text: "$mdi_wifi"
            text_font: $icon_font
            text_align: RIGHT

        - tabview:
            id: main_tabview
            x: 0
            y: 35
            width: 480
            height: 280
            bg_color: 0x1F2937
            scrollable: false
            tab_style:
              #border_color: 0x00FF00
              #border_width: 6
              height: 50
              items:
                #text_color: 0x0000FF
                height: 50
            tabs:
              - name: Temperature
                scrollable: false
                widgets:
                  - obj:
                      #id: temp
                      x: 0
                      y: 0
                      scrollable: false
                      layout: horizontal
                      widgets:
                        - obj:
                            border_width: 2
                            border_color: 0xFF0000
                            #grid_cell_row_pos: 0
                            #grid_cell_column_pos: 0
                            widgets: !include { 
                              file: room_status_box.yaml, 
                              vars: { 
                                id: "bagno_p1", 
                                room_name: "Bagno", 
                                sensor_entity_id: "input_number.temperatura_riscaldamento_diurno_stanze_p1" 
                              } 
                            }
                        - obj:
                            border_width: 2
                            border_color: 0x0000FF
                            #grid_cell_row_pos: 0
                            #grid_cell_column_pos: 1
                            widgets: !include { 
                              file: room_status_box.yaml, 
                              vars: { 
                                id: "cam_gialla", 
                                room_name: "Cam Gialla", 
                                sensor_entity_id: "input_number.temperatura_riscaldamento_diurno_stanze_p1" 
                              } 
                            }
                        - obj:
                            border_width: 2
                            border_color: 0x0000FF
                            # grid_cell_row_pos: 0
                            # grid_cell_column_pos: 2
                            widgets: !include { 
                              file: room_status_box.yaml, 
                              vars: { 
                                id: "cam_arancione", 
                                room_name: "Cam Arancione", 
                                sensor_entity_id: "input_number.temperatura_riscaldamento_diurno_stanze_p1" 
                              } 
                            }
                        - obj:
                            border_width: 2
                            border_color: 0x0000FF
                            # grid_cell_row_pos: 0
                            # grid_cell_column_pos: 3
                            widgets: !include { 
                              file: room_status_box.yaml, 
                              vars: { 
                                id: "cam_verde", 
                                room_name: "Cam Verde", 
                                sensor_entity_id: "input_number.temperatura_riscaldamento_diurno_stanze_p1" 
                              } 
                            }


              - name: Riscaldamento
                scrollable: false
                widgets:
                  - obj:
                      id: a
                      x: 10
                      y: 10
                      scrollable: false
                      widgets: !include { 
                        file: set_temperature_row_with_icon.yaml, 
                        vars: { 
                          id: "diurno_p1", 
                          icon: "$mdi_sun_thermometer",
                          floor_name: "Giorno", 
                          sensor_entity_id: "input_number.temperatura_riscaldamento_diurno_stanze_p1" 
                        } 
                      }
                  - obj:
                      id: b
                      x: 10
                      y: 120
                      scrollable: false
                      widgets: !include { 
                        file: set_temperature_row_with_icon.yaml, 
                        vars: { 
                          id: "notturno_p1", 
                          icon: "$mdi_coolant_temperature",
                          floor_name: "Notte", 
                          sensor_entity_id: "input_number.temperatura_riscaldamento_notturno_stanze_p1" 
                        } 
                      }

              - name: Tapparelle
                scrollable: false
                widgets:
                  - obj:
                      width: 100%
                      height: 100%
                      widgets:
                        - label:
                            text: "TO DO"


              - name: Info
                scrollable: false
                widgets:
                  - obj:
                      width: 100%
                      height: 100%
                      layout:
                        type: GRID
                        grid_rows: [ content,content,content,content,content,content,content,content,content,content ]
                        grid_columns: [ FR(45), FR(55) ]
                        pad_column: 4
                        pad_row: 5
                      widgets:
                        - label:
                            grid_cell_column_pos: 0
                            grid_cell_row_pos: 1
                            grid_cell_x_align: STRETCH
                            grid_cell_y_align: CENTER
                            text: "ESPHome Version:"
                        - label:
                            id: esphome_version_label
                            grid_cell_column_pos: 1
                            grid_cell_row_pos: 1
                            grid_cell_x_align: STRETCH
                            grid_cell_y_align: CENTER
                            text: "Loading..."
                        - label:
                            grid_cell_column_pos: 0
                            grid_cell_row_pos: 2
                            grid_cell_x_align: STRETCH
                            grid_cell_y_align: CENTER
                            text: "Build Date:"
                        - label:
                            grid_cell_column_pos: 1
                            grid_cell_row_pos: 2
                            grid_cell_x_align: STRETCH
                            grid_cell_y_align: CENTER
                            text:
                              format: "%s - %s"
                              args: [__DATE__, __TIME__]
                        - label:
                            grid_cell_column_pos: 0
                            grid_cell_row_pos: 3
                            grid_cell_x_align: STRETCH
                            grid_cell_y_align: CENTER
                            text: "MAC Address:"
                        - label:
                            id: connected_mac_label
                            grid_cell_column_pos: 1
                            grid_cell_row_pos: 3
                            grid_cell_x_align: STRETCH
                            grid_cell_y_align: CENTER
                            text: "00:00:00:00:00:00"
                        - label:
                            grid_cell_column_pos: 0
                            grid_cell_row_pos: 4
                            grid_cell_x_align: STRETCH
                            grid_cell_y_align: CENTER
                            text: "IP Address:"
                        - label:
                            id: ip_address_label
                            grid_cell_column_pos: 1
                            grid_cell_row_pos: 4
                            grid_cell_x_align: STRETCH
                            grid_cell_y_align: CENTER
                            text: "0.0.0.0"
                        - label:
                            grid_cell_column_pos: 0
                            grid_cell_row_pos: 5
                            grid_cell_x_align: STRETCH
                            grid_cell_y_align: CENTER
                            text: "Connected SSID"
                        - label:
                            id: connected_ssid_label
                            grid_cell_column_pos: 1
                            grid_cell_row_pos: 5
                            grid_cell_x_align: STRETCH
                            grid_cell_y_align: CENTER
                            text: "Updating..."
                        - label:
                            grid_cell_column_pos: 0
                            grid_cell_row_pos: 6
                            grid_cell_x_align: STRETCH
                            grid_cell_y_align: CENTER
                            text: "WiFi Strength"
                        - label:
                            id: wifi_signal_db_percent_label
                            grid_cell_column_pos: 1
                            grid_cell_row_pos: 6
                            grid_cell_x_align: STRETCH
                            grid_cell_y_align: CENTER
                            text: "Updating..."
                        - label:
                            grid_cell_column_pos: 0
                            grid_cell_row_pos: 7
                            grid_cell_x_align: STRETCH
                            grid_cell_y_align: CENTER
                            text: "Device Name:"
                        - label:
                            id: device_name_label
                            grid_cell_column_pos: 1
                            grid_cell_row_pos: 7
                            grid_cell_x_align: STRETCH
                            grid_cell_y_align: CENTER
                            text: "Updating..."
                        - qrcode:
                            id: cp_login
                            grid_cell_column_pos: 0
                            grid_cell_row_pos: 8
                            grid_cell_x_align: START
                            grid_cell_y_align: CENTER
                            pad_left: 10
                            pad_top: 10
                            size: 100
                            text: "WIFI:S:mynetwork;T:WPA;P:password;;"
                        - qrcode:
                            id: cp_ip_address
                            grid_cell_column_pos: 1
                            grid_cell_row_pos: 8
                            grid_cell_x_align: START
                            grid_cell_y_align: CENTER
                            pad_left: 10
                            pad_top: 10
                            size: 100
                            text: "http://192.168.4.1"
                        - label:
                            grid_cell_column_pos: 0
                            grid_cell_row_pos: 9
                            grid_cell_x_align: STRETCH
                            grid_cell_y_align: CENTER
                            text: "Captive Portal Wi-Fi"
                        - label:
                            grid_cell_column_pos: 1
                            grid_cell_row_pos: 9
                            grid_cell_x_align: STRETCH
                            grid_cell_y_align: CENTER
                            text: "CP config page"
