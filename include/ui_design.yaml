lvgl:
  pages:
    - id: main_page
      bg_color: 0x0D1117
      widgets:
        - label:
            id: time_label
            x: 5
            y: 5
            width: 150
            height: 30
            text: "12:00"
            text_color: 0xFF6B6B

        - label:
            id: wifi_label
            x: 415 # screen width is 480
            y: 0
            width: 50
            height: 20
            text: "$mdi_wifi"
            text_font: $icon_font
            text_align: RIGHT

        - tabview:
            id: main_tabview
            x: 0
            y: 35
            width: 477
            height: 280
            bg_color: 0x1F2937
            scrollable: false
