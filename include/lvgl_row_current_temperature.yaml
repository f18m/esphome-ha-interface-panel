# File: lvgl_current_temperature_row.yaml
# Purpose: A row of widegets showing current TARGET temp
#
# List of subtitutions:
#   - id
#   - icon
#   - floor_name
#   - ha_temperature_sensor_id: temperature sensor imported from HA
#

obj:
  x: 0
  y: 0
  width: 440
  height: 80
  bg_color: 0x1E293B
  border_color: 0x334155
  border_width: 2
  radius: 10
  widgets:
    - label:
        x: 0
        y: 10
        width: 220
        height: 60
        text: "Temperatura Target\nAttuale:"
        text_align: CENTER
        text_color: 0xCBD5E1
        long_mode: WRAP
    - label:
        id: lbl_current_target_temperature
        x: 250
        y: 25
        #width: 100%
        height: 30
        text: "20.0°C"
        text_align: CENTER
        text_color: 0xCBD5E1
        # bg color not working???
        bg_color: 0xFFFFFF
    - label:
        id: lbl_current_target_temperature_icon
        x: 350
        y: 20
        width: 40
        height: 30
        text: "${mdi_sun_thermometer}"
        text_font: $icon_font
        text_color: 0xF59E0B
