# File: lvgl_popup_confirm_scene_or_script.yaml
# Purpose: Reusable confirmation popup for scene/script execution.
#
# List of substitutions:
#   - scene_id
#   - scene_name
#   - scene_action_type
#   - scene_entity_id
#   - popup_title
#   - popup_body

obj:
  id: scene_confirm_overlay_${scene_id}
  hidden: true
  width: 100%
  height: 100%
  align: CENTER
  bg_color: black
  bg_opa: 100%
  clickable: true
  scrollable: false
  layout:
    type: flex
    flex_flow: column
    flex_align_main: center
    flex_align_cross: center
    flex_align_track: center
  widgets:
    - obj:
        width: 85%
        #bg_color: white
        pad_all: 12
        radius: 10
        scrollable: false
        layout:
          type: flex
          flex_flow: column
          flex_align_main: center
          flex_align_cross: center
          flex_align_track: center
          pad_row: 12
        widgets:
          - label:
              text: "${popup_title}"
              text_color: white
              #text_font: $text_font
              text_align: CENTER
              height: 45px
          - label:
              text: "${popup_body}"
              text_color: white
              text_align: CENTER
              height: 45px
          - obj:
              width: 100%
              bg_opa: TRANSP
              pad_all: 0
              scrollable: false
              height: 50px
              layout:
                type: flex
                flex_flow: row
                flex_align_main: space_evenly
                flex_align_cross: center
                flex_align_track: center
                pad_column: 12
              widgets:
                - button:
                    id: btn_scene_confirm_no_${scene_id}
                    width: 45%
                    height: 45px
                    bg_color: gray
                    on_click:
                      - lvgl.widget.hide: scene_confirm_overlay_${scene_id}
                    widgets:
                      - label:
                          text: "NO"
                          text_color: white
                          align: CENTER
                - button:
                    id: btn_scene_confirm_yes_${scene_id}
                    width: 45%
                    height: 45px
                    bg_color: green
                    on_click:
                      # IMPORTANT: first hide the popup, otherwise the Home Assistant action 
                      # may take a long time to execute and the popup will remain visible until 
                      # the action is completed, which is not a good user experience.
                      - lvgl.widget.hide: scene_confirm_overlay_${scene_id}
                      - logger.log:
                          level: INFO
                          format: "Scene confirmed: ${scene_name} (${scene_entity_id})"

                      # IMPORTANT: depending on the number of entities that need to be updated in
                      # Home Assistant, the execution of the action may take a long time and 
                      # also cause a storm of high-frequency UI updates. On ESP32-S3 + LVGL 
                      # this can intermittently stall UI for a few seconds, then watchdog-reset.
                      # See mitigation approach in the implementation of the Home Assistant action,
                      # in the sensors_room_status.yaml file
                      - homeassistant.action:
                          action: ${scene_action_type}
                          data:
                            entity_id: ${scene_entity_id}
                    widgets:
                      - label:
                          text: "YES"
                          text_color: white
                          align: CENTER
