# File: lvgl_ui_design.yaml
# Purpose: Declares the main LVGL page layout, tabs, and included UI
# components for the panel.
#

lvgl:
  pages:
    - id: page_main
      bg_color: 0x0F172A
      widgets:
        - label:
            id: lbl_time
            x: 5
            y: 8
            width: 200
            height: 30
            text: "10/03/2026 12:00"
            text_color: 0xF8FAFC
            text_font: visuelt_20

        - label:
            id: lbl_wifi
            x: 415 # screen width is 480
            y: 0
            width: 50
            height: 35
            text: "$mdi_wifi"
            text_font: mdi_icons_20
            text_align: RIGHT
            text_color: 0x94A3B8

        - tabview:
            id: tabview_main
            x: 0
            y: 35
            width: 480
            height: 280
            bg_color: 0x1E293B
            scrollable: false
            tab_style:
              #border_color: 0x00FF00
              #border_width: 6
              height: 50
              bg_color: 0x1E293B
              items:
                #text_color: 0x0000FF
                height: 50
                bg_color: 0x334155
                text_color: 0xCBD5E1
            tabs:
              - name: Stanze
                scrollable: false
                widgets: !include lvgl_tab_rooms.yaml


              - name: Riscaldamento
                scrollable: true
                widgets: !include lvgl_tab_heating.yaml


              - name: Tapparelle
                scrollable: false
                widgets: !include lvgl_tab_covers.yaml

              - name: Info
                scrollable: false
                widgets:
                  - obj:
                      width: 100%
                      height: 100%
                      bg_color: 0x1E293B
                      layout:
                        type: GRID
                        grid_rows: [ content,content,content,content,content,content,content,content,content,content,content,content,content,content,content,content ]
                        grid_columns: [ FR(45), FR(55) ]
                        pad_column: 4
                        pad_row: 5
                      widgets: !include lvgl_tab_info.yaml
