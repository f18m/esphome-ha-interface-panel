# File: lvgl_page_main.yaml
# Purpose: Declares the main LVGL page layout, tabs, and included UI
# components for the panel.
#

lvgl:
  rotation: ${display_rotation}
  pages:
    - id: page_main
      bg_color: 0x0F172A
      widgets:
        - label:
            id: lbl_time
            x: 5
            y: 3
            width: 200
            height: 30
            text: "10/03/2026 12:00"
            text_color: ${label_title_color}
            #text_font: visuelt_20
            text_font: nunito_20

        - label:
            id: lbl_wifi
            x: 415 # screen width is 480
            y: 0
            width: 50
            height: 35
            text: "$mdi_wifi"
            text_font: mdi_icons_20
            text_align: RIGHT
            text_color: ${icon_off_color}

        # see https://lvgl.io/docs/open/9.2/widgets/tabview
        # for detailed info
        # Swipe-based tab switching is intentionally disabled at boot in
        # include/scripts.yaml for the reason that it makes the UI "jumpy"
        # and some times touches trigger a tab change when the user just wants
        # to click a button
        - tabview:
            id: tabview_main
            x: 0
            y: 35
            width: 480
            height: 285
            bg_color: $bg_color
            scrollable: false
            tab_style:
              #border_color: $icon_on_color
              #border_width: 6
              # height must be enough to be confortable to press the buttons to jump from a tab to another:
              height: 45
              bg_color: white
              items:
                bg_color: $border_color
                text_color: $label_tabs_color
                text_font: $icon_font
            tabs:

              # each of this tab has 
              # FULL WIDTH AVAILABLE: 480px
              # HEIGHT AVAILABLE: 240px
              #
              # IMPORTANT: if you change the tab order, please also 
              # update the hide_unwanted_tabs script

              # index:0
              - name: "${mdi_thermometer_water}"
                id: tab_rooms
                scrollable: false
                pad_all: 10 # default padding would be 16px
                widgets: !include lvgl_tab_rooms.yaml

              # index:1
              - name: "${mdi_air_conditioner}"
                id: tab_ac_floor
                scrollable: false
                pad_all: 10 # default padding would be 16px
                widgets: !include lvgl_tab_ac_floor.yaml

              # index:2
              - name: "${mdi_home_thermometer}"
                id: tab_heating_set_temp
                scrollable: false
                pad_all: 10 # default padding would be 16px
                widgets: !include lvgl_tab_heating_set_temp.yaml

              # index:3
              - name: "${mdi_radiator}"
                id: tab_heating_details
                scrollable: false
                pad_all: 10 # default padding would be 16px
                widgets: !include lvgl_tab_heating_details.yaml

              # index:4
              - name: "${mdi_window_shutter}"
                id: tab_covers
                scrollable: false
                pad_all: 10 # default padding would be 16px
                widgets: !include lvgl_tab_covers.yaml

              # index:5
              - name: "${mdi_cog}"
                id: tab_scenes
                scrollable: false
                pad_all: 10 # default padding would be 16px
                widgets: !include lvgl_tab_scenes_or_scripts.yaml

              # index:6
              - name: "${mdi_information}"
                id: tab_info
                scrollable: true
                pad_all: 10 # default padding would be 16px
                widgets: !include lvgl_tab_info.yaml
