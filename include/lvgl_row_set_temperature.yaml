# File: lvgl_row_set_temperature.yaml
# Purpose: Defines a reusable temperature-control row with icon, label,
# spinbox, and +/- buttons, to control one single temperature.
#
# List of substitutions:
#   - id
#   - icon
#   - time_schedule
#   - ha_temperature_sensor_id: temperature sensor imported from HA
#

obj:
  x: 0
  y: 0
  width: 450
  height: 70
  bg_color: $bg_color
  border_color: $border_color
  border_width: 2
  radius: 10
  widgets:
    - label:
        id: lbl_icon_${id}
        x: 15
        y: 15
        width: 40
        height: 30
        text: "${icon}"
        text_font: $icon_font
        text_color: $icon_temp_color
    - label:
        id: lbl_floor_${id}
        x: 80
        y: 20
        width: 170
        height: 30
        text: "${time_schedule}"
        text_color: $label_title_color
    - button:
        id: btn_spin_down_daytime_${id}
        x: 180
        y: 5
        width: 70
        height: 55
        bg_color: $icon_temp_color
        pressed:
          bg_color: darkorange
        on_click:
          - lvgl.spinbox.decrement: spinbox_temperature_${id}
        widgets:
          - label:
              text: "$mdi_chevron_down"
              text_align: CENTER
              text_color: $label_spinbtn_color
              text_font: $icon_font
              align: CENTER
    - spinbox:
        id: spinbox_temperature_${id}
        x: 270
        y: 15
        width: 70
        height: 40
        value: 15
        range_from: 15
        range_to: 25
        digits: 3
        decimal_places: 1
        text_color: $label_spinbtn_color
        text_align: CENTER
        text_font: nunito_18
        bg_color: $label_title_color
        border_width: 1
        border_color: $border_color
        on_value:
          then:
            - homeassistant.action:
                action: input_number.set_value
                data:
                  entity_id: ${ha_temperature_sensor_id}
                  value: !lambda return x;
    - button:
        id: btn_spin_up_daytime_${id}
        x: 355
        y: 5
        width: 70
        height: 55
        bg_color: $icon_temp_color
        pressed:
          bg_color: darkorange
        on_click:
          - lvgl.spinbox.increment: spinbox_temperature_${id}
        widgets:
          - label:
              text: "$mdi_chevron_up"
              text_align: CENTER
              text_color: $label_spinbtn_color
              text_font: $icon_font
              align: CENTER
