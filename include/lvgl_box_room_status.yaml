# File: lvgl_room_status_box.yaml
# Purpose: Defines a reusable room-status card with room name, temperature,
# humidity, and window status icon.
# This looks like a ROUNDED VERTICAL BOX.
#
# List of subtitutions:
#   - room_id
#   - room_name

obj:
  id: "box_room_status_${room_id}"
  bg_color: $bg_color
  border_width: 2
  border_color: $border_color
  radius: 10
  scrollable: false
  #width: 100%
  width: 100
  layout: vertical
  pad_all: 5
  widgets:
    - label:
        #width: 90
        #height: 50
        text: "${room_name}"
        text_font: visuelt_20
        text_align: CENTER
        text_color: $label_title_color
        long_mode: WRAP

      # TEMPERATURE
    - obj:
        width: 100%
        layout:
          type: flex
          flex_flow: row
          flex_align_main: center
          flex_align_cross: center
          flex_align_track: center
          pad_column: 4
        widgets:
          - label:
              width: 24 # this makes the icon a bit smaller to save some space
              text: "${mdi_thermometer}"
              text_font: $icon_font_small
              text_color: $icon_temp_color

          - label:
              id: lbl_current_temp_${room_id}
              #width: 60
              text: "22.0°C"
              text_font: nunito_18
              text_color: $icon_temp_color

      # HUMIDITY
    - obj:
        width: 100%
        layout:
          type: flex
          flex_flow: row
          flex_align_main: center
          flex_align_cross: center
          flex_align_track: center
          pad_column: 4
        widgets:
          - label:
              width: 24 # this makes the icon a bit smaller to save some space
              text: "${mdi_water_percent}"
              text_font: $icon_font_small
              text_color: $icon_humidity_color
          - label:
              id: lbl_current_humidity_${room_id}
              #width: 60
              text: "55%"
              text_font: nunito_18
              text_color: $icon_humidity_color

      # WINDOW CONTACT SENSOR
    - obj:
        width: 100%
        layout:
          type: flex
          flex_flow: row
          flex_align_main: center
          flex_align_cross: center
          flex_align_track: center
        widgets:
          - label:
              id: lbl_icon_window_${room_id}
              width: 24 # this makes the icon a bit smaller to save some space
              text: "${mdi_window_closed_variant}"
              text_font: $icon_font_small
              text_color: $icon_on_color

