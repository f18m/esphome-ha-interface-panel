# File: scripts.yaml
# Purpose: Defines reusable scripts, currently for periodic date/time label updates.
# List of subtitutions:
#   - none

# Time update script 
# This is run once per minute.
script:
  - id: time_update
    then:
        # The format %I:%M %p will display the time in a 12-hour format with "am" or "pm" included  
      - lvgl.label.update:
          id: lbl_time
          text: !lambda 'return id(system_time).now().strftime("%d/%m/%Y %H:%M");'
      - logger.log:
          level: INFO
          format: "Time label updated"

  - id: hide_unwanted_rooms
    then:
      - lambda: |-
          std::string num_rooms_str = to_string(${num_rooms});
          if (num_rooms_str == "4") {
            // nothing to do in this case, all rooms are shown
            return;
          } else {
            ESP_LOGI("script hide_unwanted_rooms", "Hiding the 4th room since num_rooms is set to %s", num_rooms_str.c_str());

            // hide the 4th room in all tabs
            lv_obj_add_flag(id(box_room_status_${room4_id}), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(box_room_heating_status_${room4_id}), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(lbl_target_temp_heating_${room4_id}), LV_OBJ_FLAG_HIDDEN);
          }
