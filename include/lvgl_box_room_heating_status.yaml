# File: lvgl_box_room_heating_status.yaml
# Purpose: Defines a reusable room-status card with room name, temperature,
# humidity, and window status icon.
# This looks like a ROUNDED VERTICAL BOX.
#
# List of subtitutions:
#   - room_id
#   - room_name

obj:
  # the height of this OBJ is declared in the parent container!
  # I couldn't get layout to render correctly if I put the height here
  # (not sure why)
  id: "box_room_heating_status_${room_id}"
  bg_color: $bg_color
  border_width: 2
  border_color: $border_color
  radius: 10
  scrollable: false
  widgets:
    - label:
        x: 5
        y: 5
        width: 90
        #height: 50
        text: "${room_name}"
        text_font: visuelt_20
        text_align: CENTER
        text_color: $label_title_color
        long_mode: WRAP

      # CURRENT TEMPERATURE

    - label:
        x: 0
        y: 70
        width: 50
        #height: 40
        text: "${mdi_thermometer}"
        text_font: $icon_font_small
        text_color: $icon_temp_color

    - label:
        id: lbl_current_temp_heating_${room_id}
        x: 30
        y: 70
        width: 60
        #height: 50
        text: "20.0°C"
        text_font: nunito_18
        text_color: $icon_temp_color


      # arrow

    - label:
        x: 30
        y: 100
        width: 50
        height: 40
        text: "${mdi_arrow_down}"
        text_font: $icon_font_small
        text_color: $icon_temp_color


      # TARGET TEMPERATURE

    - label:
        x: 0
        y: 140
        width: 50
        height: 40
        text: "${mdi_thermometer}"
        text_font: $icon_font_small
        text_color: $icon_temp_target_color

    - label:
        id: lbl_target_temp_heating_${room_id}
        x: 30
        y: 140
        width: 60
        height: 50
        text: "21.0°C"
        text_font: nunito_18
        text_color: $icon_temp_target_color

      # FLOOR HEATING CONTROLLER SWITCH

    - label:
        id: lbl_floor_heating_controller_${room_id}
        x: 30
        y: 180
        width: 50
        height: 30
        text: "${mdi_radiator}"
        text_font: $icon_font_small
        text_color: $icon_on_color
