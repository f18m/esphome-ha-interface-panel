# File: lvgl_room_status_box.yaml
# Purpose: Defines a reusable room-status card with room name, temperature,
# humidity, and window status icon.
# This looks like a ROUNDED VERTICAL BOX.
#
# List of subtitutions:
#   - room_id
#   - room_name

obj:
  bg_color: 0x1E293B
  border_width: 2
  border_color: 0x334155
  radius: 10
  #width: 100%
  scrollable: false
  width: 100
  height: 230
  widgets:
    - label:
        x: 5
        y: 5
        width: 90
        #height: 50
        text: "${room_name}"
        text_font: nunito_20
        text_align: CENTER
        text_color: 0xF8FAFC
        long_mode: WRAP

      # CURRENT TEMPERATURE

    - label:
        x: 0
        y: 70
        width: 50
        #height: 40
        text: "${mdi_thermometer}"
        text_font: $icon_font_small
        text_color: 0xF59E0B

    - label:
        id: lbl_current_temp_heating_${room_id}
        x: 30
        y: 70
        width: 60
        #height: 50
        text: "20.0°C"
        text_font: nunito_18
        text_color: 0xF59E0B


      # arrow

    - label:
        x: 30
        y: 100
        width: 50
        height: 40
        text: "${mdi_arrow_down}"
        text_font: $icon_font_small
        text_color: 0xF59E0B


      # TARGET TEMPERATURE

    - label:
        x: 0
        y: 140
        width: 50
        height: 40
        text: "${mdi_thermometer}"
        text_font: $icon_font_small
        text_color: 0xEE0000

    - label:
        id: lbl_target_temp_heating_${room_id}
        x: 30
        y: 140
        width: 60
        height: 50
        text: "21.0°C"
        text_font: nunito_18
        text_color: 0xCBD5E1

      # FLOOR HEATING CONTROLLER SWITCH

    - label:
        id: lbl_floor_heating_controller_${room_id}
        x: 30
        y: 180
        width: 50
        height: 30
        text: "${mdi_radiator}"
        text_font: $icon_font_small
        text_color: 0x22C55E
