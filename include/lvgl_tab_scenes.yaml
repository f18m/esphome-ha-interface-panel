# File: lvgl_tab_scenes.yaml
# Purpose: creates a tab for controlling scenes, displaying scene buttons.
# List of subtitutions:
#   - scene1_icon
#   - scene1_name
#   - scene1_action_type
#   - scene1_entity_id
#   - .... all repeated for scene2, scene3, and scene4 ...

- obj:
    width: 100%
    height: 100%
    layout:
      type: flex
      flex_flow: column
      flex_align_main: start
      flex_align_track: center
      flex_align_cross: center
    widgets:
      - !include {
          file: lvgl_box_scene_or_script.yaml,
          vars: {
            scene_id: "scene1",
            scene_icon: "${scene1_icon}",
            scene_name: "${scene1_name}",
            scene_action_type: "${scene1_action_type}",
            scene_entity_id: "${scene1_entity_id}"
          }
        }
      - !include {
          file: lvgl_box_scene_or_script.yaml,
          vars: {
            scene_id: "scene2",
            scene_icon: "${scene2_icon}",
            scene_name: "${scene2_name}",
            scene_action_type: "${scene2_action_type}",
            scene_entity_id: "${scene2_entity_id}"
          }
        }
      - !include {
          file: lvgl_box_scene_or_script.yaml,
          vars: {
            scene_id: "scene3",
            scene_icon: "${scene3_icon}",
            scene_name: "${scene3_name}",
            scene_action_type: "${scene3_action_type}",
            scene_entity_id: "${scene3_entity_id}"
          }
        }
      - !include {
          file: lvgl_box_scene_or_script.yaml,
          vars: {
            scene_id: "scene4",
            scene_icon: "${scene4_icon}",
            scene_name: "${scene4_name}",
            scene_action_type: "${scene4_action_type}",
            scene_entity_id: "${scene4_entity_id}"
          }
        }