# File: lvgl_tab_scenes.yaml
# Purpose: creates a tab for controlling scenes, displaying scene buttons.
# List of subtitutions:
#   - scene1_icon
#   - scene1_name
#   - scene1_action_type
#   - scene1_entity_id
#   - .... all repeated for scene2 and scene3 ...

- obj:
    width: 100%
    height: 100%
    layout:
      type: flex
      flex_flow: column
      flex_align_main: start
      flex_align_track: center
      flex_align_cross: center
    widgets:
      - button:
          id: btn_scene1
          width: 100%
          height: 60
          bg_color: $icon_temp_color
          pressed:
            bg_color: darkorange
          layout:
            type: flex
            flex_flow: row
            flex_align_main: center
            flex_align_cross: center
            flex_align_track: center
            pad_column: 10
          on_click:
            - logger.log:
                level: INFO
                format: "Scene button clicked: ${scene1_name} (${scene1_entity_id})"
            - homeassistant.action:
                action: ${scene1_action_type}
                data:
                  entity_id: ${scene1_entity_id}
          widgets:
            - label:
                text: "${scene1_icon}"
                text_align: CENTER
                text_color: $label_spinbtn_color
                text_font: $icon_font
                align: CENTER
            - label:
                text: "${scene1_name}"
                text_align: CENTER
                text_color: $label_spinbtn_color
                align: CENTER
